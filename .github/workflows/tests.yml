name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: mvn verify (JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        # 11 is the baseline the SDK compiles for (--release 11); 17 and 21 are the current LTS lines.
        java: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - run: ./mvnw -B verify
