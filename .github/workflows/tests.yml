name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: mvn verify (JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        # 11 is the baseline the SDK compiles for (--release 11); 17 and 21 are the current LTS lines.
        java: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - run: ./mvnw -B verify
