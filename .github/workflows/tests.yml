name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: mvn verify (JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        # 11 is the baseline the SDK compiles for (--release 11); 17 and 21 are the current LTS lines.
        java: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - run: ./mvnw -B verify
