version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      maven:
        patterns: ["*"]
    ignore:
      # JUnit 6 needs Java 17. The SDK supports Java 11.
      - dependency-name: org.junit.jupiter:*
        versions: [">= 6"]
